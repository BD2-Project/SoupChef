[package]
name = "soupchef"
version = "0.3.0"
description = "Cliente de escritorio de SoupDB"
authors = ["BD2-Project"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "soupchef_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Protocolo v1.1 (type_name/encoding, VECTOR, opaque, prepared statements).
# Commit probado de la rama de integración. Al publicarse rsoup v0.2.0, usar
# `tag = "v0.2.0"`.
rsoup = { git = "https://github.com/BD2-Project/rsoup.git", rev = "21358f7c579022e6908cf271da8ae392f392dae0" }
tokio = { version = "1", features = ["sync"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
