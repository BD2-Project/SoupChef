<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SoupChef</title>
    <script>
      // Se aplica antes del primer pintado para evitar el parpadeo de tema.
      // La clave debe coincidir con STORAGE_KEY en src/lib/theme.svelte.ts.
      try {
        const stored = localStorage.getItem('soupchef-theme')
        const system = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = stored ?? system
      } catch {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
